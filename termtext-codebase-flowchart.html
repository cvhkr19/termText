<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>termtext — codebase flowchart</title>
<style>
  :root {
    --bg: #ffffff;
    --surface-1: #f7f7f5;
    --text-primary: #1a1a1a;
    --text-secondary: #5f5e5a;
    --text-accent: #185fa5;
    --border: #e2e0d8;
    --border-strong: #b4b2a9;
    --bg-accent: #e6f1fb;
    --border-accent: #85b7eb;
    --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --surface-1: #1f1f24;
      --text-primary: #f0f0ee;
      --text-secondary: #a8a7a0;
      --text-accent: #85b7eb;
      --border: #333338;
      --border-strong: #52524e;
      --bg-accent: #0c447c;
      --border-accent: #378add;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 24px 64px;
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-sans);
    line-height: 1.5;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 4px; }
  .sub { font-size: 13px; color: var(--text-secondary); margin: 0 0 28px; }
  h3 { font-size: 15px; font-weight: 500; margin: 0 0 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 28px; font-size: 13px; color: var(--text-secondary); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  #overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 36px; }
  .card { border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  .card h4 { font-size: 14px; font-weight: 500; margin: 0 0 10px; }
  .file-row { margin-bottom: 8px; }
  .file-row code { font-family: var(--font-mono); font-size: 12px; color: var(--text-primary); }
  .file-row div { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
  #flow-buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  #flow-buttons button {
    font-size: 12.5px; padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface-1);
    color: var(--text-primary); cursor: pointer; font-family: var(--font-sans);
  }
  #flow-buttons button.active { background: var(--bg-accent); border-color: var(--border-accent); }
  #flow-panel { border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  #flow-panel .flow-title { font-size: 14px; font-weight: 500; margin-bottom: 14px; }
  .step-row { display: flex; gap: 12px; padding: 8px 0; }
  .step-row + .step-row { border-top: 1px solid var(--border); }
  .step-num {
    flex: 0 0 22px; height: 22px; border-radius: 50%;
    background: var(--surface-1); border: 1px solid var(--border-strong);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--text-secondary);
  }
  .step-body code { font-family: var(--font-mono); font-size: 12.5px; color: var(--text-accent); }
  .step-body div { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-top: 2px; }
  footer { margin-top: 40px; font-size: 12px; color: var(--text-secondary); }
</style>
</head>
<body>
<div class="wrap">
  <h1>termtext — codebase flowchart</h1>
  <p class="sub">Generated from the actual source. File overview by directory, plus click-through traces of eight core flows.</p>

  <div class="legend">
    <span><span class="dot" style="background:#1D9E75"></span>client (TUI)</span>
    <span><span class="dot" style="background:#7F77DD"></span>server</span>
    <span><span class="dot" style="background:#D85A30"></span>protocol (shared)</span>
    <span><span class="dot" style="background:#888780"></span>storage</span>
  </div>

  <div id="overview"></div>

  <h3>Trace a flow</h3>
  <div id="flow-buttons"></div>
  <div id="flow-panel"></div>

  <footer>termtext — generated flowchart</footer>
</div>

<script>
const OVERVIEW = [
  { color: "#1D9E75", title: "client/ — Bubble Tea TUI", files: [
    ["main.go", "entry point; resolves config path/flags, starts the Bubble Tea program"],
    ["config.go", "endpoint (http/ws URL builder), ~/.chattui/config.json load + save"],
    ["model.go", "root model struct, screen/pane enums, message + contact structs"],
    ["auth.go", "login/register screen, HTTP calls to /register and /login"],
    ["network.go", "wsConnect, readLoop (server envelope → typed tea.Msg), writePump, backoff"],
    ["events.go", "handlers for each incoming tea.Msg — contacts, messages, acks, typing, presence, history"],
    ["update.go", "top-level Update() router; chat keys/mouse, focus/pane cycling, send/typing/history logic"],
    ["view.go", "renders title bar, sidebar, conversation, ticks, footer"],
    ["files.go", "upload/download HTTP calls for file transfer"],
    ["shiftkey*.go", "platform-specific Shift-key detection for Shift+Enter newline"],
    ["styles.go", "lipgloss style definitions"],
  ]},
  { color: "#7F77DD", title: "server/ — Go relay", files: [
    ["main.go", "flags/env, opens store, builds hub + upgrader, registers routes, starts hub.Run()"],
    ["hub.go", "Hub: single goroutine owning username→Client map; register/unregister/route/presence channels"],
    ["client.go", "serveWS handshake (protocol check, auth, register), per-conn readPump/writePump, envelope dispatch"],
    ["http.go", "/register /login /logout handlers, session issuance"],
    ["contacts.go", "contact_request/accept/decline handlers, contact_list + pending push on connect"],
    ["messages.go", "handleMessage (persist+route+ack), handleAckRead, handleHistoryRequest, flushOfflineMessages"],
    ["presence.go", "typing relay, broadcastPresence to contacts on connect/disconnect"],
    ["files.go", "multipart upload handler, download handler (auth-checked, nosniff)"],
    ["ratelimit.go", "token-bucket limiter middleware for /register and /login"],
    ["auth/auth.go", "bcrypt hash/check, random session token generation"],
  ]},
  { color: "#D85A30", title: "internal/protocol/ — shared", files: [
    ["protocol.go", "Envelope type, every payload struct, ProtocolVersion const, fixed-width SentAtLayout, Encode()"],
  ]},
  { color: "#888780", title: "server/store/ — SQLite", files: [
    ["store.go", "schema + every query: users, sessions, contacts, conversations, messages, files"],
  ]},
];

const FLOWS = [
{ name: "Login & connect", steps: [
  ["client/main.go", "loads ~/.chattui/config.json via config.go; no valid token → shows auth screen"],
  ["client/auth.go", "submitAuth() → doAuth() → httpAuth() POSTs to /register or /login"],
  ["server/http.go + auth/auth.go", "validates, bcrypt hash/check, store.CreateUser/GetUserByUsername, issueSession() writes a sessions row, returns token"],
  ["client/config.go", "config.save() persists the token to disk"],
  ["client/network.go", "wsConnect() dials .../ws?protocol_version=1 with the token as a Bearer header"],
  ["server/client.go", "serveWS(): checkProtocolVersion() → authenticateHTTP() (store.GetUserByToken, checks expiry) → upgrades → hub.register"],
  ["server/client.go + presence.go + contacts.go + messages.go", "on connect: broadcastPresence(\"online\"), pushContactList, pushPendingContactRequests, flushOfflineMessages — all in one pass"],
  ["client/events.go", "handleConnected() starts readLoop/writePump, calls resendPendingReadAcks(), focuses input"],
]},
{ name: "Add / accept / decline contact", steps: [
  ["client/update.go", "runCommand() parses /add <user> → builds a ContactPayload → model.trySend()"],
  ["server/client.go", "readPump dispatches TypeContactRequest → contacts.go handleContactRequest()"],
  ["server/store/store.go", "RequestContact() inserts a pending row (ordered-pair primary key)"],
  ["server/hub.go", "routes the request live if the target is online; otherwise it just sits as a stored row"],
  ["server/contacts.go", "on the target's next connect, pushPendingContactRequests() replays it"],
  ["server/contacts.go", "target's /accept → handleContactAccept() → store.AcceptContact() → notifyContactAccepted() pushes an updated contact_list to both sides"],
  ["client/events.go", "handleContactAccept()/handleContactList() updates the sidebar on both ends"],
]},
{ name: "Send a message", steps: [
  ["client/update.go", "sendChatMessage() builds a MessagePayload with client_msg_id, appends an optimistic local message (tick: sent)"],
  ["client/model.go", "trySend() writes the envelope onto the outbox channel"],
  ["client/network.go", "writePump() marshals it to JSON and writes the WebSocket frame"],
  ["server/client.go", "readPump() decodes the envelope, dispatches TypeMessage → messages.go"],
  ["server/messages.go + store.go", "handleMessage() persists via CreateMessage/GetOrCreateConversation before ever relaying it"],
  ["server/hub.go", "routes to the recipient's outbox if online; if not, the unread row itself is the offline queue"],
  ["server/client.go", "writePump() sends a message_ack back to the sender, and relays the message live if the recipient is online"],
  ["client/network.go + events.go", "readLoop() decodes message_ack/message → handleMessageAck() flips the sender's tick to delivered; handleIncomingMessage() renders it for the recipient"],
]},
{ name: "Typing indicator", steps: [
  ["client/update.go", "handleTypingKeystroke() — first keystroke starts a generation-tracked idle timer, sends TypingPayload{isTyping:true}"],
  ["server/presence.go", "handleTyping() relays it live to the other participant only — never persisted"],
  ["client/update.go", "idle timeout (3s), sending, or switching conversations fires sendTyping(false)"],
  ["client/events.go", "handleIncomingTyping() shows/clears the \"typing…\" notice on the other side"],
]},
{ name: "Presence (online/offline)", steps: [
  ["server/client.go", "on connect, and via readPump's deferred cleanup on disconnect, calls presence.go broadcastPresence()"],
  ["server/presence.go + store.go", "looks up the user's accepted contacts (AcceptedContacts) and routes a PresencePayload to each one that's online"],
  ["server/hub.go", "delivers it through the same route channel as any other envelope"],
  ["client/events.go", "handleIncomingPresence() flips that contact's online/offline dot"],
]},
{ name: "Chat history pagination", steps: [
  ["client/update.go", "maybeLoadHistory() on opening a conversation, or maybeLoadMoreHistory() on scroll-to-top, sends a HistoryRequestPayload{conversation_id, before, limit}"],
  ["server/messages.go", "handleHistoryRequest() calls store.go's HistoryPage()"],
  ["server/store/store.go", "queries messages ordered by the fixed-width SentAtLayout cursor — avoids the lexicographic-ordering bug a variable-width timestamp would cause"],
  ["client/events.go", "handleHistoryResponse() hands the page to update.go"],
  ["client/update.go", "prependHistory()/mergeInitialHistory() merges it in without duplicating messages or jumping the scroll position"],
]},
{ name: "File transfer", steps: [
  ["client/update.go", "runSendFile() → client/files.go uploadFileCmd()/uploadFile() — multipart POST to /upload with the Bearer token"],
  ["server/files.go", "uploadHandler(): authenticateHTTP, size-cap check, newFileID() (crypto/rand), writes to disk"],
  ["server/store/store.go", "CreateFile() then CreateFileMessage() — recorded like a normal message"],
  ["server/hub.go", "routes the file message exactly like a text message, online or queued"],
  ["client/update.go", "recipient's downloadFocusedFile() → files.go downloadFileCmd()/fetchAndSaveFileTo() — GETs /download/<id>, saves to disk (no auto-open)"],
  ["server/files.go", "downloadHandler(): rejects (403) unless the requester is a participant in that file's conversation; streams as application/octet-stream with X-Content-Type-Options: nosniff"],
]},
{ name: "Reconnection", steps: [
  ["client/network.go", "readLoop() returns a wsDisconnectedMsg on any read error"],
  ["client/events.go", "handleDisconnected() schedules reconnectCmd() with exponential backoff, unless the failure was 401 (bad token) or 426 (protocol mismatch) — those give up instead of retrying"],
  ["client/events.go", "handleReconnectTick() re-invokes wsConnect(); success re-runs the same connect sequence as login (contacts, pending requests, offline messages)"],
  ["client/update.go", "resendPendingReadAcks() re-sends any ack_read that was generated while reading locally during the outage but never reached a live connection"],
]},
];

const overviewEl = document.getElementById("overview");
OVERVIEW.forEach(group => {
  const card = document.createElement("div");
  card.className = "card";
  card.style.borderLeft = "3px solid " + group.color;
  const h = document.createElement("h4");
  h.textContent = group.title;
  card.appendChild(h);
  group.files.forEach(([name, desc]) => {
    const row = document.createElement("div");
    row.className = "file-row";
    const code = document.createElement("code");
    code.textContent = name;
    const d = document.createElement("div");
    d.textContent = desc;
    row.appendChild(code);
    row.appendChild(d);
    card.appendChild(row);
  });
  overviewEl.appendChild(card);
});

const buttonsEl = document.getElementById("flow-buttons");
const panelEl = document.getElementById("flow-panel");

function renderFlow(idx) {
  const flow = FLOWS[idx];
  panelEl.innerHTML = "";
  const title = document.createElement("div");
  title.className = "flow-title";
  title.textContent = flow.name;
  panelEl.appendChild(title);
  flow.steps.forEach(step => {
    const row = document.createElement("div");
    row.className = "step-row";
    const num = document.createElement("div");
    num.className = "step-num";
    row.appendChild(num);
    const body = document.createElement("div");
    body.className = "step-body";
    const file = document.createElement("code");
    file.textContent = step[0];
    const desc = document.createElement("div");
    desc.textContent = step[1];
    body.appendChild(file);
    body.appendChild(desc);
    row.appendChild(body);
    panelEl.appendChild(row);
  });
  Array.from(panelEl.querySelectorAll(".step-num")).forEach((n, i) => n.textContent = i + 1);
}

FLOWS.forEach((flow, idx) => {
  const btn = document.createElement("button");
  btn.textContent = flow.name;
  btn.addEventListener("click", () => {
    Array.from(buttonsEl.children).forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderFlow(idx);
  });
  buttonsEl.appendChild(btn);
});

buttonsEl.children[0].classList.add("active");
renderFlow(0);
</script>
</body>
</html>
